
[package]
name = "frc-match-clipper"
version = "0.2.1"
edition = "2021"
description = "Clip FRC livestreams into match videos with resumable YouTube uploads"
repository = "https://github.com/jackshim415/match-clipper"
readme = "README.md"
publish = false
include = ["src/**", "Cargo.toml", "Cargo.lock", "README.md", "AGENTS.md", ".env.example"]

[dependencies]
anyhow = "1"
axum = "0.8"
base64 = "0.22"
bytes = "1"
chrono = "0.4.45"
dotenvy = "0.15.7"
open = "5"
rand = "0.8"
reqwest = { version = "0.12", features = ["json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tokio = { version = "1", features = ["full", "process"] }
url = "2"
